<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>OpenWiki</title>
  <link rel="stylesheet" href="/static/style.css" />
  <script>
    // Apply the saved theme before first paint (no flash of the wrong theme).
    try { var t = localStorage.getItem("owiki-theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <header>
    <div class="brand">Open<span>Wiki</span></div>
    <div id="doc-title" class="doc-title"></div>
    <div id="project-badge" class="project-badge" hidden></div>
    <button id="theme-toggle" class="theme-toggle" title="Hell/Dunkel umschalten" aria-label="Design umschalten">🌙</button>
  </header>

  <div id="layout">
    <aside id="sidebar">
      <input id="search" type="search" placeholder="Semantische Suche…" autocomplete="off" />
      <label class="search-opt" title="BM25 + Vektor-Suche fusionieren (findet exakte Begriffe)"><input type="checkbox" id="search-hybrid"> Hybrid (BM25 + Vektor)</label>
      <select id="source-filter" class="source-filter" hidden aria-label="Quelle filtern"></select>
      <div id="search-results" class="search-results" hidden></div>
      <nav id="nav" class="nav"></nav>
    </aside>

    <main id="center" class="center">
      <div id="tabs" class="tabs" role="tablist">
        <button class="tab" data-tab="project" role="tab">Projekt</button>
        <button class="tab active" data-tab="wiki" role="tab">Wiki</button>
        <button class="tab" data-tab="graph" role="tab">Graph</button>
        <button class="tab" data-tab="entities" role="tab">Begriffe</button>
        <button class="tab" data-tab="analyse" role="tab">Analyse</button>
        <button class="tab" data-tab="memory" role="tab">Gedächtnis</button>
        <button class="tab" data-tab="eval" role="tab">Evaluation</button>
        <button class="tab" data-tab="system" role="tab">System</button>
        <button class="tab" data-tab="tutorial" role="tab">Tutorial</button>
        <button class="tab" data-tab="help" role="tab">Hilfe</button>
      </div>
      <div id="content" class="content">
        <p class="muted">Wird geladen…</p>
      </div>
    </main>

    <aside id="chat">
      <div class="chat-head">
        <span class="chat-modes" role="tablist">
          <button type="button" class="chat-mode active" data-mode="agent" title="Mehrschrittiger Werkzeug-Agent: sucht, liest und bearbeitet Seiten">Agent</button>
          <button type="button" class="chat-mode" data-mode="ask" title="RAG-Frage-Antwort mit Quellenangaben (nur lesend)">Ask</button>
        </span>
        <span class="muted" id="chat-model"></span>
      </div>
      <div id="ask-controls" class="ask-controls" hidden>
        <label title="Antworten aus den Themen-Zusammenfassungen (Communities)"><input type="checkbox" id="ask-global"> Global</label>
        <label title="Seed-Seiten entlang der Graphkanten erweitern"><input type="checkbox" id="ask-graph" checked> GraphRAG</label>
        <label title="BM25 + Vektor-Suche fusionieren"><input type="checkbox" id="ask-hybrid"> Hybrid</label>
        <label title="Trefferliste per LLM neu sortieren"><input type="checkbox" id="ask-rerank"> Re-rank</label>
        <label class="ask-k" title="Anzahl der Seed-Treffer">k <input type="number" id="ask-k" min="1" max="20" value="5"></label>
      </div>
      <div id="chat-log" class="chat-log">
        <div class="msg agent">
          Frag mich etwas über das Handbuch — oder bitte mich, eine Seite zu bearbeiten.
        </div>
      </div>
      <form id="chat-form" class="chat-form">
        <textarea id="chat-input" rows="3" placeholder="Frage oder Änderungswunsch…"></textarea>
        <button type="submit" id="chat-send">Senden</button>
      </form>
    </aside>
  </div>

  <script src="/static/marked.min.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>

<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>OpenWiki</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <header>
    <div class="brand">Open<span>Wiki</span></div>
    <div id="doc-title" class="doc-title"></div>
    <div id="project-badge" class="project-badge" hidden></div>
  </header>

  <div id="layout">
    <aside id="sidebar">
      <input id="search" type="search" placeholder="Semantische Suche…" autocomplete="off" />
      <div id="search-results" class="search-results" hidden></div>
      <nav id="nav" class="nav"></nav>
    </aside>

    <main id="center" class="center">
      <div id="tabs" class="tabs" role="tablist">
        <button class="tab active" data-tab="wiki" role="tab">Wiki</button>
        <button class="tab" data-tab="help" role="tab">Hilfe</button>
        <button class="tab" data-tab="tutorial" role="tab">Tutorial</button>
        <button class="tab" data-tab="graph" role="tab">Graph</button>
        <button class="tab" data-tab="project" role="tab">Projekt</button>
      </div>
      <div id="content" class="content">
        <p class="muted">Wird geladen…</p>
      </div>
    </main>

    <aside id="chat">
      <div class="chat-head">Agent <span class="muted" id="chat-model"></span></div>
      <div id="chat-log" class="chat-log">
        <div class="msg agent">
          Frag mich etwas über das Handbuch — oder bitte mich, eine Seite zu bearbeiten.
        </div>
      </div>
      <form id="chat-form" class="chat-form">
        <textarea id="chat-input" rows="3" placeholder="Frage oder Änderungswunsch…"></textarea>
        <button type="submit" id="chat-send">Senden</button>
      </form>
    </aside>
  </div>

  <script src="/static/marked.min.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>

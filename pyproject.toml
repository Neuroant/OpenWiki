[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# Distribution name is `owiki` (the PyPI name `openwiki` is taken); the *import* package
# stays `openwiki`, and both `openwiki` and `owiki` console scripts are installed.
# NOTE: no license is declared yet (kept private pending a decision) — set one (and add a
# LICENSE file) before any public PyPI upload; the release workflow is manual for that reason.
[project]
name = "owiki"
version = "0.88.0"
description = "OpenWiki — build agentic wikis: turn documents into a searchable, graph-linked, agent-editable knowledge base (local Ollama)."
readme = "README.md"
requires-python = ">=3.10,<3.14"
authors = [{ name = "Anton" }]
keywords = ["wiki", "rag", "graphrag", "knowledge-graph", "kuzu", "ollama",
            "agent", "mcp", "semantic-search", "pdf", "local-llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: Other/Proprietary License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Markup",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Private :: Do Not Upload",
]
dependencies = [
    "PyMuPDF>=1.24.0",
    "numpy>=1.26",
    "kuzu>=0.11",
    "tomli>=2.0; python_version < '3.11'",
]

[project.urls]
Homepage = "https://github.com/Neuroant/OpenWiki"
Repository = "https://github.com/Neuroant/OpenWiki"
Issues = "https://github.com/Neuroant/OpenWiki/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "build>=1.2",
    "twine>=5.0",
]
# World-model analysis (`owiki analyze`). The core coupling metrics are pure NumPy; this
# extra enriches them (community coherence: silhouette + ARI) and backs the forthcoming
# 2D semantic map (projections). Opt-in — the base install stays lean (ADR-4/5).
analysis = [
    "scikit-learn>=1.3",
]

[project.scripts]
openwiki = "openwiki.cli:main"
owiki = "openwiki.cli:main"   # collision-free alias (an npm tool also ships `openwiki`)

[tool.setuptools.packages.find]
include = ["openwiki*"]

[tool.setuptools.package-data]
openwiki = ["web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
